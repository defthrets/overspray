; ============================================================================
;  OVERSPRAY
;  A fire extinguisher that sprays paint. Or a spray can, which is the same
;  thing wearing different clothes.
;
;  Hold the trigger with it out. Whatever is in front of you takes a splatter --
;  walls, road, kerbs, shutters, ceilings, anything a probe lands on. The further
;  away the surface, the wider the splatter, and every one lands at its own angle
;  so a covered wall reads as paint rather than as one blob tiled fifty times.
;
;  Every setting below has a working default. Delete this file and the mod runs
;  exactly the same.
; ============================================================================

[General]
Enabled=true

; THE ONLY KEY IN THIS MOD.
;
; It opens the picker. Inside there you choose a colour and, on the bottom row,
; take an extinguisher -- which is where that lives rather than on a second
; binding, because a mod with two hotkeys has one you have forgotten.
;
; After that there is nothing to press. Aim and fire and it paints.
MenuKey=F11

; Whether paint survives a reload.
Persist=true

; Switch off when Posted Up is installed alongside.
;
; IT HAS THIS BUILT IN, as a Graffiti app on the phone, running THE SAME ENGINE --
; literally the same files. With both installed both engines wake up, both watch
; the same trigger and both paint: two cans in his hand, two plumes stacked, and
; two decals for every one you meant. It looks like the effect is twice as thick
; as it should be, because it is.
;
; F3 ALWAYS WORKS EITHER WAY. This only decides whether the spray starts switched
; ON or OFF when Posted Up is found beside it -- it does not disable the script,
; because a mod that silently does nothing is worse than one that does the wrong
; thing, and the screen that could explain it would be the screen you cannot open.
;
; Turning MOD on from the picker sets this to false for you, so choosing
; to run both is remembered rather than undone by the next load.
StandDownForPostedUp=true


[Paint]
; How far the EXTINGUISHER carries, in metres. The can has its own reach, further
; down -- they are different tools and sharing one number made one of them wrong.
Range=10

; Splatters per second while the trigger is down.
Rate=22

; Whether the gap between one splatter and the next is filled in.
;
; THIS IS WHAT MAKES A LINE, and it is why raising Rate alone does not. A rate is
; marks per SECOND, so whether they join up depends on how fast the reticle is
; travelling -- any fixed rate is beads when you sweep quickly and a pile of paint
; in one spot when you hold still.
;
; With this on, each dab knows where the last one landed and lays marks along the
; path between them: as many as the distance needs and no more. The spacing
; follows the reticle rather than the clock.
Continuous=true

; How far apart the filled marks sit, as a fraction of their own width. Below
; about 0.5 they overlap into a solid band; higher reads as a dotted trail.
;
; IT MOVES IN STEPS, NOT SMOOTHLY. The fill count is a whole number, so most small
; changes do nothing at all -- with the can's marks on an ordinary sweep, anything
; from 0.30 to 0.38 gives the same result and 0.40 is where it drops a step.
; Nudging this by 0.02 and watching for a difference is how you conclude a working
; setting is broken.
Overlap=0.40

; The most marks one dab may fill in. A cap for the pathological case -- whipping
; the reticle across a courtyard puts two hits forty metres apart, and without
; this that one frame would try to lay a thousand decals.
MaxFill=16

; THE SIZE COMES FROM THE DISTANCE, not from a fixed number.
;
; Width = SizeAtOneMetre x distance^SpreadPower. At the defaults:
;
;      1m away  ->  0.2m across
;      5m away  ->  1.0m across
;     10m away  ->  2.0m across
;
; That is a straight line, so it is a real cone. Raise SpreadPower above 1 for a
; plume that blooms toward the far end instead.
SizeAtOneMetre=0.2
SpreadPower=1

; The floor and ceiling, after everything else has had its say.
MinSize=0.08
MaxSize=3.5

; How solid a mark goes on with the nozzle AT the wall, and how solid at the far
; end of the can's reach.
;
; A can that loses width with distance and keeps density is not a can. The width
; already opens out as you back off -- that is what turns a stream of decals into
; a spray -- and nothing went with it: a mark laid from the far end of the reach
; was as solid as one laid with the cap against the plaster. So backing off gave
; you a bigger stamp of exactly the same paint, and the halo of thin overspray
; around every real stroke had nowhere to come from.
;
; One fact explains both. A plume holds together while it has pressure and opens
; out as it loses it, and the paint it carries is spread over that wider circle,
; so it arrives thinner. WIDER AND FAINTER ARE THE SAME THING.
;
; Squared, like the width, and for the same reason: close work is solid and stays
; solid, and the fade is the far half. At the middle of the reach a mark is a
; QUARTER of the way to OpacityFar, not half.
;
; Measured against each tool's OWN reach, so the extinguisher fades across its
; four metres and the can across its two and a half.
;
; Set OpacityFar to the same as Opacity, or to 0, and nothing fades.
Opacity=1.0
OpacityFar=0.6

; Whether police who SEE you tagging book you for it.
;
; One star, which in this game IS the arrest -- officers pursue and cuff, and
; only from two stars do they draw and shoot. It is held at one for as long as a
; can is the worst thing in your hands, because a chase escalates on its own the
; moment you run, and a tag should not turn into a firefight.
;
; Pull an actual gun in front of them and the cap comes off. What happens after
; that is the game's business and it will not be an arrest.
;
; Seen, not heard, and not merely nearby: it wants a clear line of sight and an
; officer roughly facing you. One the other side of the wall you are painting has
; not seen anything.
CopsCare=true

; Whether a swept stroke is drawn as STRETCHED decals rather than a chain of
; round ones. false is exactly what the mod did before, so this is one word to
; undo.
;
; THIS IS ABOUT THE DECAL POOL AND NOTHING ELSE. The game holds a few hundred to
; a couple of thousand decals in the whole world. A measured piece came to 2,582
; marks -- three times the entire pool on a default install. Nothing is lost when
; that happens, everything is saved and restored, but only the nearest few
; hundred can be on a wall at once, so a big piece is always partly missing.
;
; The fix is fewer marks for the same paint, not more slots. ADD_DECAL takes a
; width AND a height, so one decal stretched along the path covers what a run of
; round ones did.
StrokeStreaks=true

; How far the reticle must travel before a streak is laid, as a fraction of the
; mark. THE WHOLE TRADE IS HERE: lower is more marks and a smoother line, higher
; is fewer marks and a longer stretch of the same texture.
StreakStep=0.7

; How long the spray may put nothing down before a plain round mark is laid
; anyway. Standing still the reticle never travels, so without this, holding the
; trigger on one spot would paint nothing at all.
StreakIdleMs=55

; Which way round the stretch goes, if strokes come out square to the path.
StrokeSideways=false

; Whether paint starts to RUN when you hold it on one spot.
;
; OFF. Built, tried, taken out -- but left here in one piece rather than deleted,
; so it is one word to have back. Sweep and you get a clean line; sit still and
; it runs.
;
; Drips never start on anything level. Down-the-surface is world-down with the
; part facing out of the wall removed, and on a floor or a ceiling there is
; nothing left of it -- paint does not run down a pavement.
Drips=false

; How long the spray has to stay on one spot before it starts to run.
DripAfterMs=1000

; How far the reticle may wander and still count as the same spot. Generous on
; purpose: a hand on a stick is never still, and a threshold only a perfectly
; steady aim could hold is a feature nobody would ever see.
DripArea=0.28

; How often a run creeps further down. Placed a step at a time rather than drawn
; whole -- a drip that appears all at once is a shape, one that arrives over half
; a second is paint moving.
DripStepMs=45

; Which way round the stretch goes, for if a drip comes out lying on its side.
;
; A drip is ONE decal stretched long, not a row of round ones. ADD_DECAL takes a
; width and a height and every mark in this mod used to hand it the same number
; twice, which is why the first drips were a dotted line however much the dots
; were made to overlap -- a splatter is mostly transparent speckle, so two on
; top of each other is more speckle, not a solid mark.
;
; Which of the two the decal's side vector governs is not written down anywhere
; Rockstar left behind, so if drips come out HORIZONTAL, set this to true.
DripSideways=false

; How long one run gets, and how many runs a single spot will produce.
DripLength=0.22
DripRuns=3

; How wide a drip is, against the spray mark that started it. Wider than it
; sounds like it should be: a drip has to be solid, and solid costs a mark every
; half-width, so a THIN drip is not a cheaper one -- it is the same run drawn out
; of more, smaller marks.
DripWidth=0.55

; The decal type used when what you hit is a VEHICLE. 0 uses the same one as
; everything else.
;
; A car is not a wall as far as the decal system is concerned. The paint decal
; goes on the map perfectly and appears to do nothing at all on a vehicle. The
; game clearly CAN mark a car -- bullet holes and blood land on one and stay
; there while it drives -- and those are the weapImpact family, so that is what
; this tries.
;
;   4010  weapImpact_metal      a car panel. The default.
;   4020  weapImpact_concrete
;   4050  weapImpact_wood
;   1030  splatters_paint       what walls use, and what does not show on a car
;
; The first one that lands on a vehicle writes a line in Overspray.log saying
; whether the game agrees it is there. If none of them take, no decal type works
; on a vehicle.
;
; Paint on a car is never saved: the decal sits in world space, so restoring it
; next session would put it in the middle of a road.
VehicleDecal=4010

; Which decal texture the SPRAY CAN lays down. The extinguisher always uses the
; paint one.
;
; The texture is what a mark actually looks like, and a script cannot author one
; -- picking between the ones the game already ships is the whole of the control
; there is over the shape of a splatter.
;
; Worth knowing: the colour you pick MULTIPLIES the texture rather than replacing
; it. 1030 is authored pale, which is why any colour comes out as that colour.
; Anything darker or already coloured drags everything toward itself.
;
;   1030  paint   pale and speckled, takes colour honestly. The default.
;   1020  mud     bigger wetter blobs -- fuller coverage, but a brown cast on
;                 every colour. Worth a look if paint is too speckly for you.
;   1040  water   faint. Barely marks a wall.
;   1010  blood   red, and it looks it.
;
; AND THE IMPACT FAMILY -- the mark a BULLET leaves in a wall.
;
;   4020  concrete impact   what a machine pistol writes on stucco
;   4010  metal impact      the same, on a panel
;   4050  wood impact
;
; These matter for a reason that has nothing to do with guns. The splatter
; textures are SPLATTERS: speckled, with holes in them, so a wall covered in
; them still reads as a wall somebody threw something at. An impact mark is a
; small SOLID lump with a soft edge, which is much closer to what a can leaves
; -- a hundred of them overlapping is a FILLED SHAPE rather than a cloud of
; dots.
;
; The cost is that they are authored nearly black, and your colour multiplies
; the texture rather than replacing it. So an impact tag is a BLACK tag with a
; hint of your colour in the soft edge. For an outline or a throw-up that is
; not a compromise; for a bright fill it is fatal. CanColourGain is the dial
; that might drag it back, and might do nothing -- see below.
;
; Marks remember which one placed them, so changing this leaves everything
; already on a wall exactly as it is.
CanDecal=1030

; A SECOND texture, laid instead of the first every so often, and how often in
; a hundred marks. Either one at 0 turns it off, which is the default.
;
; One texture repeated is a pattern and the eye finds it: every mark from a can
; is the same picture at a different size and angle, and it is that regularity
; across a whole wall that says "decal". A second texture in the mix breaks it
; for nearly nothing -- nine marks in ten solid, the tenth a splatter, so the
; tag keeps its fill AND gets the speckle and stray flecks a real can throws.
;
; Rolled per MARK, not per stroke, so neighbouring dabs differ rather than the
; wall coming out in bands. Each mark keeps what it got, through a save.
;
; A solid tag with paint flecked through it:
;
;   CanDecal=4020
;   MixDecal=1030
;   MixEvery=12
;   CanColourGain=2.6
MixDecal=0
MixEvery=0

; Which nozzle is on the can. The picker changes this and writes it back here,
; so whichever you were last using is the one you start with.
;
;   0  thin    the finest this can goes, 0.055 across at the nozzle.
;   1  stock   twice that.
;   2  fat     four times. Cannot do fine work at all, which is the point.
;
; A cap moves the FLOOR, not the ceiling: a fat cap cannot draw a thin line
; however close you hold it, but it can still only manage what the distance
; allows at the far end -- and so can a thin one. So they converge as you step
; back, which is correct. A metre off a wall the cap is no longer the thing
; deciding how wide the band is.
;
; The multipliers themselves are in Caps.cs. This is the floor they multiply:
; tune CanMinSize and all three caps move with it.
Cap=0

; How many times more paint the CAN lays than the extinguisher does.
;
; One dial rather than three, because density is not one number -- it comes out
; of the rate (what you get standing still), the trail spacing (what you get
; sweeping) and the trail's ceiling (what stops a fast sweep thinning out).
; Turn up one alone and only half your hand speeds get denser.
;
; At 2 the can lays twice the paint per stroke at any speed, and spends the
; decal budget twice as fast for it. That is the whole of the trade and there is
; no version of this where it is not: half as much stays on the wall at once.
;
; 1 is the old behaviour. The extinguisher is never affected -- it already
; covers a garage door in a second.
CanDensity=3.0

; How hard the CAN's colour is driven into its decal. 1 is a plain colour, and
; is what every version before this passed.
;
; An experiment, and worth understanding before you touch it. Your colour
; MULTIPLIES the texture, so multiply only ever goes downward -- the texture is
; a ceiling. On the brown mud texture every colour lands dark and brown for
; exactly that reason.
;
; But the argument is a float and nothing says it stops at 1. Per channel, a
; brown times (0, 2.6, 0) is a bright green -- so IF the shader does not clamp,
; a dark texture can be driven back to colour. It may well clamp, in which case
; this does nothing and you have lost nothing finding out.
;
; Only turn it up alongside a dark CanDecal. On the pale paint texture anything
; above 1 blows every colour out to white.
;
;   1.0   off, and correct for CanDecal=1030
;   2.6   a reasonable first try with CanDecal=1020
CanColourGain=1.0

; How hard the two metallics -- chrome and gold -- scatter their shade from
; mark to mark.
;
; Nothing in this game can make a decal reflective, so metal is faked the only
; way it can be: neighbouring marks land in different shades, some near white
; and some gunmetal, and the eye reads the scatter as a reflection. This is how
; wide that scatter goes. 1 is as shipped, 0 gives you flat grey and flat
; mustard, and much past 1.6 it stops looking lit and starts looking random.
;
; Only affects chrome and gold. The other eleven are flat paint.
MetallicShine=1.0

; How much each mark varies in size, as a fraction either way.
;
; DENSITY WITHOUT MORE DECALS COMES FROM HERE. At 0.15 marks ranged from 85% to
; 115%, and a mark at 85% covers only 72% of the area of a full one -- so a
; sixth of them were leaving a thin patch where they landed. At 0.06 coverage is
; even and the same number of decals reads noticeably fuller.
;
; Not free: variation is what stops a line looking stamped. Lower than this and
; the marks start looking identical.
SizeJitter=0.06

; How many marks are kept before the oldest is thrown away for good.
;
; THE GAME'S OWN DECAL POOL IS THE REAL CEILING, not this number. It holds a few
; hundred across the entire world and refuses quietly once they are gone.
;
; So when it refuses, this mod takes the slot back off whichever mark is furthest
; away and already painted, and sprays the new one into it. The far mark stays in
; the list and comes back when you walk to it. That turns the pool from a hard cap
; on how much you can paint into a budget spent on whatever you are looking at --
; which is why this number can now be in the thousands and mean something.
MaxMarks=50000

; The visible jet, tinted to your colour.
;
; This is scr_lamgraff_paint_spray -- Rockstar's OWN paint spray, the one their
; graffiti scene uses. Their script starts it and then calls
; SET_PARTICLE_FX_LOOPED_COLOUR on it, which is proof it takes an arbitrary
; colour rather than merely tolerating one. It comes out of the nozzle rather
; than the wrist, so what you watch land is where the paint lands.
;
; The fire truck's water cannon is NOT available: nothing in the entire
; decompiled script set names a water-jet effect, because it is driven by a
; vehicle weapon rather than by a script -- there is no name for a script to ask
; for. The paint spray is the better answer anyway.
;
; A SECOND EFFECT RIDES WITH IT ON THE EXTINGUISHER: a wider tinted cloud around
; the jet, because an extinguisher discharges a volume and not a thin line, and
; the jet on its own reads as a laser pointer. It goes on thinner than the jet so
; you can still see what you are painting through your own smoke.
;
; The spray can gets the jet only. A can does not billow.
;
; false leaves the plain white spray alone.
ColourTheSmoke=true

; How big the spray effect is out of each tool.
;
; SEPARATE NUMBERS BECAUSE THEY ARE SEPARATE TOOLS. An extinguisher discharge that
; fills half an alley is right for an extinguisher; the same cloud out of a
; six-inch can is absurd, and it sits between you and the wall you are painting.
;
; The can also gets NO cloud and no smoke fallback at all. If Rockstar's paint jet
; will not start, the can sprays invisibly rather than puffing smoke -- the log
; says which happened, and the paint lands either way.
JetScale=1.0
CanJetScale=0.42

; Whether the spray tilts with the camera.
;
; The paint never needed this -- it comes off a ray from the camera and has always
; gone where the reticle is. This is the visible spray agreeing with it.
JetFollowsAim=true

; Where the spray leaves the CAN, in the can's own space.
;
; Rockstar start this effect on the can at zero offset, which puts it at the
; model's origin -- somewhere in the body of the tin, not at the tip. From behind
; him nobody notices; in first person the spray visibly leaves halfway down.
;
; All three axes, because which way is "up the can" in a prop's local space is not
; something you can work out on paper. Nudge in steps of about 0.02, and if one
; sends it the wrong way, put a minus in front of it.
CanJetUp=0.09
CanJetOut=0.0
CanJetSide=0.0

; Which animation he plays while spraying in FIRST PERSON.
;
; The default is the ready pose, because the real spraying clip swings his arm
; across his body and takes the can out of frame from inside his head.
;
; It is a setting because these can only be judged by looking at them. Try:
;
;   spray_can_idle_male     the ready pose. Still, can up. Default.
;   spray_can_var_01_male   a spray variation -- may move less than the main one
;   spray_can_var_02_male   the other variation
;   spray_can_male          the full clip. Right finger, wrong arm in first person.
;
; A trigger finger on its own is NOT possible from a script -- the game lets a mod
; read a bone's rotation and never set one, so the only finger you can have is the
; one already in a clip. That is what this picks between.
FirstPersonClip=spray_can_idle_male

; Whether the extinguisher paints at all.
;
; No hotkey for this on purpose -- there is one key in this mod and it opens the
; picker. It is here for somebody who wants a plain extinguisher back without
; uninstalling.
;
; Either way the weapon is never modified. It puts fires out exactly as it always
; did, because all this does is watch it and add paint on top.
PaintEnabled=true

; Tint the can itself to the colour you are spraying.
;
; APPROXIMATELY, and it cannot be otherwise. A weapon's colour comes from its
; model's textures and the only hook a script has is the tint index -- a fixed
; table of eight the game ships: black, green, gold, pink, army, LSPD, orange,
; platinum. There is no native that takes an RGB because there is nothing for it
; to write to. A true match means editing w_am_fire_exting's textures, which is
; an OpenIV job and a different kind of mod.
;
; So the picked colour is snapped to whichever of the eight is nearest. Pick hot
; pink and the can goes pink. Pick teal and you get whichever of green or LSPD
; blue is closer. The can goes back to red when paint mode goes off.
TintTheCan=true

; How far up out of his fist the spray can sits, in metres.
;
; The one measurement here you have to LOOK at rather than reason about: it is an
; offset in the hand bone's own local space, and a bone's axes are whatever the
; animators made them. Raised from the 0.012 the tag run uses -- that seats the
; can mid-grip, and this puts the nozzle up against his fingertip, which is where
; a hand actually holds one, since you press the tip.
;
; Nudge in steps of about 0.005. If it moves the WRONG way on your build, the
; axis runs the other way: use a negative number.
;
; The spray follows this on its own -- the jet is started on the can, so its
; offset is in the can's space. CanJetUp is a separate thing: where the jet sits
; WITHIN the can, rather than where the can sits in his hand.
CanSeat=0.060

; ----------------------------------------------------------------------------
;  THE SPRAY CAN
; ----------------------------------------------------------------------------

; What he holds. true is a spray can, false is the extinguisher.
;
; A LOOK, NOT A MODE. The extinguisher is the weapon underneath either way -- it
; is what supplies the aiming camera, the reticle and a trigger, and a prop can
; do none of those -- so this hides its model, puts prop_cs_spray_can in his
; hand, and plays the game's own tagging animation over his upper body.
;
; You do not normally set this by hand -- the picker has a button for each tool,
; and taking one sets this along with the reach and the cone that go with it.
; That is the point of it being one choice rather than two: asking for an
; extinguisher and being handed the can's four-metre reach was a real bug.
SprayCanLook=true

; The can's own reach and cone. NOT the extinguisher's.
;
; A can is worked a foot or two from the wall; an extinguisher is a pressure
; vessel you stand back from. One shared curve makes one of the two wrong.
;
;     0.5m and nearer  ->  0.025m across (the floor)
;     1m               ->  0.07m
;     1.5m             ->  0.13m
;     2m               ->  0.20m
;     2.5m             ->  0.28m, and it stops there
;
; A bloom rather than a cone: the extinguisher is a straight line because it is a
; jet under pressure, but a can held near a wall lays a tight band and only opens
; out as you back off. Power 1.5, with k solved so four metres stays put.
;
; Past four metres there is nothing. A can that reaches across a street is the
; tell that it is a repainted fire extinguisher.
CanRange=2.0
CanSizeAtOneMetre=0.237
CanSpreadPower=2.11
CanMinSize=0.055
CanMaxSize=0.30

; How much longer a tank lasts than the game gives it. 1 is stock.
;
; The stock tank is sized for putting out a car fire, not for painting a
; warehouse wall, so it empties about a third of the way into anything worth
; doing.
;
; Done by refund rather than by an infinite-ammo flag: the mod watches what the
; extinguisher spends and hands part of it back, so nothing is left switched on
; when the mod is not running. The extinguisher is never actually modified.
ExtinguisherLasts=3

; Whether the extinguisher ever empties. It does not.
;
; Same reasoning as the can. ExtinguisherLasts above is what governs it if you set
; this back to true -- the dial is left in rather than deleted.
ExtinguisherRunsOut=false

; Whether the spray can ever empties. It does not.
;
; A can of paint in a mod about painting should not send you back to a menu
; halfway up a wall.
CanRunsOut=false
